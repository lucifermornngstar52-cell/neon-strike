  document.querySelector('#inp button').disabled=false;
  add('n','привет! я нано-гпт на 151.8 млн параметров, обучена на 154к диалогов. спроси: как дела, кто ты, расскажи о себе...');
}).catch(e=>add('n','не загрузилось: '+e));
function send(){const inp=document.getElementById('q'),q=inp.value.trim();if(!q||!model||busy)return;
add('u',q);inp.value='';busy=true;
const think=add('n','');think.classList.add('caret');
const sto={};MAN.__vocab.forEach((c,i)=>sto[c]=i);
const ids=[];for(const ch of (hist+'В: '+q+'\nО:'))ids.push(sto[ch]!==undefined?sto[ch]:0);
let out='';
(function step(){
  if(out.endsWith('\n\n')||out.length>=140||ids.length>=CFG.T){finish();return;}
  const lg=model.forward(ids)[Math.min(ids.length,CFG.T)-1];
  const arr=Array.from(lg),mx=Math.max(...arr);
  const pr=arr.map((v,i)=>[Math.exp((v-mx)/0.6),i]).sort((a,b)=>b[0]-a[0]).slice(0,6);
  let sum=0;for(const p of pr)sum+=p[0];
  let r=Math.random()*sum,ci=pr[pr.length-1][1];
  for(const p of pr){r-=p[0];if(r<=0){ci=p[1];break;}}
  ids.push(ci);out+=MAN.__vocab[ci];
  think.textContent=out.replace(/\n+$/,'');
  chat.scrollTop=chat.scrollHeight;
  setTimeout(step,0);
})();
function finish(){think.classList.remove('caret');
  const ans=out.split('\n\n')[0].trim();
  think.textContent=ans||'...';
  hist+='В: '+q+'\nО: '+ans+'\n\n';
  if(hist.length>800)hist=hist.slice(-600);
  busy=false;}}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script></body></html>
